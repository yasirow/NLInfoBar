<svg xmlns="http://www.w3.org/2000/svg" width="920" height="80" viewBox="0 0 460 40" role="img" aria-label="Illustration: NLInfoBar on a dark taskbar next to the notification area, showing 19.4 KB/s upload and 455.4 KB/s download">
  <title>NLInfoBar on the taskbar (illustration)</title>
  <rect width="460" height="40" fill="#1C1C1C"/>
  <rect y="0" width="460" height="1" fill="#2E2E2E"/>

  <!-- NLInfoBar: upload on top, download below -->
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF">
    <path d="M14 5 L18 9.5 L15.6 9.5 L15.6 15 L12.4 15 L12.4 9.5 L10 9.5 Z" fill="#E74C3C"/>
    <text x="23" y="15">19.4 KB/s</text>
    <path d="M14 35 L18 30.5 L15.6 30.5 L15.6 25 L12.4 25 L12.4 30.5 L10 30.5 Z" fill="#2ECC71"/>
    <text x="23" y="33">455.4 KB/s</text>
  </g>

  <!-- generic notification area -->
  <g fill="none" stroke="#CFCFCF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113 22 L117 18 L121 22"/>
  </g>
  <g fill="#8E8E8E">
    <rect x="135" y="13" width="14" height="14" rx="3"/>
    <rect x="160" y="13" width="14" height="14" rx="3" fill="#6F8FAF"/>
    <rect x="185" y="13" width="14" height="14" rx="7" fill="#7FAF8A"/>
    <rect x="210" y="13" width="14" height="14" rx="3" fill="#A58FC0"/>
    <rect x="235" y="13" width="14" height="14" rx="3"/>
  </g>
  <g fill="none" stroke="#CFCFCF" stroke-width="1.3">
    <path d="M268 25 L268 15 L272 15 L277 11 L277 29 L272 25 Z"/>
    <path d="M281 16 Q284 20 281 24"/>
    <path d="M296 27 L296 22 M300 27 L300 18 M304 27 L304 14"/>
  </g>
  <text x="365" y="24.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">12:00</text>
  <g fill="none" stroke="#CFCFCF" stroke-width="1.3">
    <rect x="428" y="13" width="16" height="13" rx="1.5"/>
    <path d="M431 17.5 H441 M431 21.5 H438"/>
  </g>
</svg>
